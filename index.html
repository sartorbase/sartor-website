    <script>
      (function() {
        function isWsError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : ((err && err.message) || (err && err.reason) || String(err) || '');
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event && event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.onunhandledrejection = function(event) {
          if (isWsError(event && event.reason)) {
            if (event && event.preventDefault) event.preventDefault();
            return true;
          }
        };
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (
            firstArg.indexOf('[vite] failed to connect to websocket') !== -1 ||
            firstArg.indexOf('WebSocket closed without opened') !== -1
          )) {
            return;
          }
          origError.apply(console, arguments);
        };
      })();
